name: rebuilt-zijing-forum

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql,docker
      ZIJING_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rebuilt_zijing_forum}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      ZIJING_DB_USERNAME: ${MYSQL_APP_USER:-forum}
      ZIJING_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      ZIJING_JWT_SECRET: ${ZIJING_JWT_SECRET:?Set ZIJING_JWT_SECRET in .env}
      FORUM_STORAGE_TYPE: ${FORUM_STORAGE_TYPE:-local}
      FORUM_STORAGE_LOCAL_ROOT: /app/uploads
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL:-}
      FORUM_AI_ENABLED: ${FORUM_AI_ENABLED:-false}
      FORUM_AI_URL: ${FORUM_AI_URL:-https://api.deepseek.com/chat/completions}
      FORUM_AI_API_KEY: ${FORUM_AI_API_KEY:-}
      FORUM_AI_MODEL: ${FORUM_AI_MODEL:-deepseek-chat}
      FORUM_LEARNING_AI_ENABLED: ${FORUM_LEARNING_AI_ENABLED:-false}
      FORUM_LEARNING_AI_BASE_URL: ${FORUM_LEARNING_AI_BASE_URL:-https://api.deepseek.com/v1}
      FORUM_LEARNING_AI_API_KEY: ${FORUM_LEARNING_AI_API_KEY:-}
      FORUM_LEARNING_AI_MODEL: ${FORUM_LEARNING_AI_MODEL:-deepseek-flash}
      FORUM_REDIS_ENABLED: ${FORUM_REDIS_ENABLED:-false}
      FORUM_RABBIT_ENABLED: ${FORUM_RABBIT_ENABLED:-false}
      FORUM_ES_ENABLED: ${FORUM_ES_ENABLED:-false}
      FORUM_ES_API_KEY: ${FORUM_ES_API_KEY:-}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-forum}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - forum_uploads:/app/uploads

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rebuilt_zijing_forum}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_APP_USER:-forum}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4.11-alpine
    profiles: ["redis", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    profiles: ["rabbit", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-forum}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.5
    profiles: ["search", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  mysql_data:
  forum_uploads:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
