server:
  port: 8080

spring:
  datasource:
    url: ${ZIJING_DB_URL:jdbc:mysql://mysql:3306/rebuilt_zijing_forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${ZIJING_DB_USERNAME:forum}
    password: ${ZIJING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:forum}
    password: ${RABBITMQ_PASSWORD:}

forum:
  storage:
    type: ${FORUM_STORAGE_TYPE:local}
    local-root: /app/uploads
  redis:
    enabled: ${FORUM_REDIS_ENABLED:false}
  rabbit:
    enabled: ${FORUM_RABBIT_ENABLED:false}
  search:
    ai:
      enabled: ${FORUM_AI_ENABLED:false}
    elasticsearch:
      enabled: ${FORUM_ES_ENABLED:false}
      url: http://elasticsearch:9200
  learning-ai:
    enabled: ${FORUM_LEARNING_AI_ENABLED:false}
