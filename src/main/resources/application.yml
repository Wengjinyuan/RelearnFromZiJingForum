spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  application:
    name: rebuilt-zijing-forum
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    # 默认使用本地 H2 文件库，方便在 IDEA 中直接运行；生产/练习 MySQL 时启用 mysql profile。
    url: jdbc:h2:file:./data/rebuilt-zijing-forum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    # 本地 H2 数据库密码；IDEA Database 连接时也填写同一个值。
    password: 123456
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

forum:
  demo-data:
    enabled: true
  storage:
    type: ${FORUM_STORAGE_TYPE:local}
    local-root: ${FORUM_STORAGE_LOCAL_ROOT:./uploads}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      region: ${ALIYUN_OSS_REGION:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
  rabbit:
    enabled: false
  redis:
    enabled: false
  search:
    ai:
      enabled: ${FORUM_AI_ENABLED:false}
      url: ${FORUM_AI_URL:https://api.deepseek.com/chat/completions}
      api-key: ${FORUM_AI_API_KEY:}
      model: ${FORUM_AI_MODEL:deepseek-chat}
      connect-timeout-seconds: ${FORUM_AI_CONNECT_TIMEOUT_SECONDS:5}
      request-timeout-seconds: ${FORUM_AI_REQUEST_TIMEOUT_SECONDS:25}
    elasticsearch:
      enabled: false
      url: ${FORUM_ES_URL:http://localhost:9200}
      api-key: ${FORUM_ES_API_KEY:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
security:
  jwt:
    # 仅用于本地练习。部署时必须通过 ZIJING_JWT_SECRET 覆盖，长度至少 32 字节。
    secret: ${ZIJING_JWT_SECRET:rebuilt-zijing-forum-local-development-key-change-me}
    expiration-seconds: 7200

server:
  port: 80
