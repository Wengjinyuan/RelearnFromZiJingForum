<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>紫荆论坛 · 个人信息</title>
    <link rel="icon" type="image/x-icon" href="../img/zj_icon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .info-wrap { max-width: 980px; margin: 20px auto; padding: 0 16px; }
        .info-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
        .info-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
        .info-avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
        .info-name { font-size: 24px; font-weight: 800; color: #1e1e2a; }
        .info-sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
        .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .field { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfaff; min-width: 0; }
        .field-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
        .field-value { color: #1e1e2a; font-weight: 650; overflow-wrap: anywhere; }
        .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
        .btn { border: 1px solid var(--line); background: #fff; color: #1e1e2a; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
        .btn-primary { border: 0; color: #fff; background: linear-gradient(90deg, var(--purple-500), var(--purple-600)); }
        @media (max-width: 700px) { .field-grid { grid-template-columns: 1fr; } .info-head { align-items: flex-start; } }
    </style>
    <script src="../js/vue.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
    <script src="../js/axios-config.js"></script>
</head>
<body>
<div id="topbar-container"></div>
<div id="app" class="info-wrap">
    <div class="info-card">
        <div class="info-head">
            <img class="info-avatar" :src="resolveAvatarUrl(user.avatar)" @error="handleAvatarError" alt="头像">
            <div>
                <div class="info-name">{{ user.username || '未命名用户' }}</div>
                <div class="info-sub">ID: {{ user.id || '-' }} · account: {{ user.account || '-' }}</div>
            </div>
        </div>
        <div class="field-grid">
            <div class="field" v-for="field in fields" :key="field.key">
                <div class="field-label">{{ field.label }}</div>
                <div class="field-value">{{ field.value || '暂无' }}</div>
            </div>
        </div>
        <div class="actions">
            <button class="btn" @click="goProfile">个人主页</button>
            <button class="btn btn-primary" @click="editProfile">修改</button>
        </div>
    </div>
</div>
<script src="../components/TopBar.js"></script>
<script>
    new Vue({ el: '#topbar-container', template: '<top-bar></top-bar>' });
    new Vue({
        el: '#app',
        data: {
            user: {},
            defaultAvatar: '../img/头像示例.jpg'
        },
        computed: {
            fields() {
                return [
                    { key: 'id', label: 'id', value: this.user.id },
                    { key: 'account', label: '账户', value: this.user.account },
                    { key: 'email', label: '邮箱', value: this.user.email },
                    { key: 'mobile', label: '手机号', value: this.user.mobile },
                    { key: 'username', label: '用户名称', value: this.user.username },
                    { key: 'avatar', label: '头像', value: this.user.avatar },
                    { key: 'gender', label: '性别', value: this.user.gender },
                    { key: 'birthday', label: '生日', value: this.user.birthday },
                    { key: 'signature', label: '签名', value: this.user.signature },
                    { key: 'major', label: '专业', value: this.user.major },
                    { key: 'role', label: '身份', value: this.user.role },
                    { key: 'status', label: '状态', value: this.user.status },
                    { key: 'postCount', label: '帖子数', value: this.user.postCount },
                    { key: 'essenceCount', label: '精华帖子数', value: this.user.essenceCount },
                    { key: 'likeCount', label: '点赞数', value: this.user.likeCount },
                    { key: 'favoriteCount', label: '收藏数', value: this.user.favoriteCount },
                    { key: 'followerCount', label: '粉丝数', value: this.user.followerCount },
                    { key: 'followingCount', label: '关注者数量', value: this.user.followingCount },
                    { key: 'createTime', label: '创建时间', value: this.user.createTime },
                    { key: 'updateTime', label: '个人信息更新时间', value: this.user.updateTime }
                ];
            }
        },
        mounted() {
            const userId = new URLSearchParams(window.location.search).get('userId') || localStorage.getItem('userId');
            if (!userId || userId === 'null') {
                window.location.href = '../login.html';
                return;
            }
            axios.get(`/api/user/info/${userId}`).then(response => {
                if (response.data.code === 1) {
                    this.user = response.data.data || {};
                    localStorage.setItem('userInfo', JSON.stringify(this.user));
                }
            });
        },
        methods: {
            resolveAvatarUrl(avatar) {
                if (!avatar) return this.defaultAvatar;
                if (avatar.startsWith('http') || avatar.startsWith('data:') || avatar.startsWith('blob:') || avatar.startsWith('/')) return avatar;
                return avatar;
            },
            handleAvatarError(event) { event.target.src = this.defaultAvatar; },
            editProfile() { window.location.href = `edit-profile.html?userId=${this.user.id}`; },
            goProfile() { window.location.href = `profile.html?userId=${this.user.id}`; }
        }
    });
</script>
</body>
</html>
