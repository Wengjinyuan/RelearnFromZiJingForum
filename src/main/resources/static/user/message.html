<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫荆论坛 · 私信</title>
    <link rel="icon" type="image/x-icon" href="../img/zj_icon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/vue.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
    <script src="../js/axios-config.js"></script>
    <style>
        body { margin:0; background:#f7f7fb; color:#222238; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
        .message-shell { width:min(1120px,calc(100% - 32px)); height:calc(100vh - 104px); min-height:560px; margin:24px auto; display:grid; grid-template-columns:320px 1fr; background:#fff; border:1px solid #ebe8f3; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(74,52,130,.08); }
        .conversation-panel { border-right:1px solid #ebe8f3; overflow:auto; }
        .panel-title { padding:20px; font-size:20px; font-weight:700; border-bottom:1px solid #ebe8f3; }
        .conversation { padding:16px 18px; border-bottom:1px solid #f1eff6; cursor:pointer; display:flex; gap:12px; }
        .conversation:hover,.conversation.active { background:#f6f1ff; }
        .avatar { width:44px; height:44px; flex:0 0 44px; border-radius:50%; background:#7654da; color:#fff; display:grid; place-items:center; font-weight:700; }
        .conversation-main { min-width:0; flex:1; }
        .conversation-line { display:flex; justify-content:space-between; gap:8px; align-items:center; }
        .peer { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .preview,.time,.empty-tip { color:#8b8798; font-size:13px; }
        .preview { margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .badge { min-width:20px; height:20px; padding:0 6px; display:grid; place-items:center; border-radius:10px; background:#e5484d; color:#fff; font-size:12px; }
        .chat-panel { display:flex; flex-direction:column; min-width:0; }
        .chat-header { height:68px; padding:0 22px; border-bottom:1px solid #ebe8f3; display:flex; align-items:center; justify-content:space-between; }
        .chat-title { font-weight:700; font-size:17px; }
        .profile-link { color:#6a3be0; cursor:pointer; font-size:13px; }
        .messages { flex:1; overflow:auto; padding:22px; background:#fbfafe; }
        .message-row { display:flex; margin:10px 0; }
        .message-row.mine { justify-content:flex-end; }
        .bubble { max-width:72%; padding:10px 13px; border-radius:12px; background:#fff; border:1px solid #ebe8f3; white-space:pre-wrap; overflow-wrap:anywhere; }
        .mine .bubble { color:#fff; background:#7654da; border-color:#7654da; }
        .message-time { margin-top:5px; opacity:.65; font-size:11px; }
        .composer { padding:14px 18px; border-top:1px solid #ebe8f3; display:flex; gap:12px; }
        .composer textarea { flex:1; min-height:54px; max-height:120px; resize:vertical; padding:10px 12px; border:1px solid #dcd7e8; border-radius:9px; font:inherit; outline:none; }
        .composer textarea:focus { border-color:#7654da; }
        .send { width:88px; border:0; border-radius:9px; background:#7654da; color:#fff; font-weight:650; cursor:pointer; }
        .send:disabled { opacity:.5; cursor:not-allowed; }
        .center { height:100%; display:grid; place-items:center; text-align:center; color:#8b8798; padding:24px; }
        .error { padding:10px 16px; background:#fff2f2; color:#c83737; font-size:13px; }
        @media(max-width:760px){ .message-shell{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 88px)} .conversation-panel{max-height:250px;border-right:0;border-bottom:1px solid #ebe8f3}.chat-panel{min-height:560px} }
    </style>
</head>
<body>
<div id="topbar-container"></div>
<div id="app" class="message-shell">
    <aside class="conversation-panel">
        <div class="panel-title">私信</div>
        <div v-if="loadingConversations" class="empty-tip" style="padding:20px">正在加载会话...</div>
        <div v-for="item in conversations" :key="item.id" class="conversation"
             :class="{active: activeConversation && activeConversation.id === item.id}" @click="openConversation(item)">
            <div class="avatar">{{ (item.peerAccount || '?').slice(0,1).toUpperCase() }}</div>
            <div class="conversation-main">
                <div class="conversation-line">
                    <span class="peer">{{ item.peerAccount }}</span>
                    <span v-if="item.unreadCount" class="badge">{{ item.unreadCount > 99 ? '99+' : item.unreadCount }}</span>
                </div>
                <div class="conversation-line">
                    <span class="preview">{{ item.lastContent || '暂无消息' }}</span>
                    <span class="time">{{ shortTime(item.lastMessageAt) }}</span>
                </div>
            </div>
        </div>
        <div v-if="!loadingConversations && conversations.length === 0" class="empty-tip" style="padding:20px">
            暂无会话，可从其他用户主页点击“私信”开始聊天。
        </div>
    </aside>

    <main class="chat-panel">
        <template v-if="activePeerId">
            <header class="chat-header">
                <span class="chat-title">{{ activePeerName }}</span>
                <span class="profile-link" @click="viewPeer">查看主页</span>
            </header>
            <div v-if="errorMessage" class="error">{{ errorMessage }}</div>
            <section class="messages" ref="messages">
                <div v-if="loadingMessages" class="center">正在加载消息...</div>
                <div v-else-if="messages.length === 0" class="center">还没有消息，发一句问候吧。</div>
                <div v-for="msg in messages" :key="msg.id" class="message-row" :class="{mine: String(msg.senderId) === String(currentUserId)}">
                    <div class="bubble">
                        <div>{{ msg.content }}</div>
                        <div class="message-time">{{ formatTime(msg.createdAt) }}</div>
                    </div>
                </div>
            </section>
            <footer class="composer">
                <textarea v-model="draft" maxlength="4000" placeholder="输入私信，Enter 发送，Shift+Enter 换行" @keydown.enter.exact.prevent="sendMessage"></textarea>
                <button class="send" :disabled="sending || !draft.trim()" @click="sendMessage">{{ sending ? '发送中' : '发送' }}</button>
            </footer>
        </template>
        <div v-else class="center">选择左侧会话，或从用户主页发起私信。</div>
    </main>
</div>

<script src="../components/TopBar.js"></script>
<script>new Vue({el:'#topbar-container',template:'<top-bar></top-bar>'});</script>
<script>
new Vue({
    el:'#app',
    data:{
        conversations:[], activeConversation:null, activePeerId:null, activePeerName:'',
        messages:[], draft:'', currentUserId:localStorage.getItem('userId'),
        loadingConversations:false, loadingMessages:false, sending:false, errorMessage:'', pollTimer:null
    },
    mounted(){
        if(!localStorage.getItem('token')) { location.href='../login.html?redirect='+encodeURIComponent(location.pathname+location.search); return; }
        const targetId=new URLSearchParams(location.search).get('targetId');
        this.loadConversations().then(()=> targetId && this.openTarget(targetId));
        this.pollTimer=setInterval(()=>this.refreshActive(),5000);
    },
    beforeDestroy(){ if(this.pollTimer) clearInterval(this.pollTimer); },
    methods:{
        async loadConversations(){
            this.loadingConversations=true;
            try{
                const response=await axios.get('/api/messages/conversations');
                this.conversations=response.data.data||[];
                if(this.activeConversation){
                    const fresh=this.conversations.find(x=>String(x.id)===String(this.activeConversation.id));
                    if(fresh) this.activeConversation=fresh;
                }
            }catch(error){ this.errorMessage=error.response?.data?.message||'会话列表加载失败'; }
            finally{ this.loadingConversations=false; }
        },
        async openTarget(targetId){
            if(String(targetId)===String(this.currentUserId)){ this.errorMessage='不能给自己发私信'; return; }
            const existing=this.conversations.find(x=>String(x.peerId)===String(targetId));
            if(existing){ await this.openConversation(existing); return; }
            this.activeConversation=null; this.activePeerId=targetId; this.messages=[];
            try{
                const response=await axios.get(`/api/user/info/${targetId}`);
                const user=response.data.data||{};
                this.activePeerName=user.username||user.displayName||user.account||`用户${targetId}`;
            }catch(error){ this.activePeerName=`用户${targetId}`; this.errorMessage='用户信息加载失败，请确认用户存在'; }
        },
        async openConversation(item){
            this.activeConversation=item; this.activePeerId=item.peerId; this.activePeerName=item.peerAccount;
            this.loadingMessages=true; this.errorMessage='';
            try{
                const response=await axios.get(`/api/messages/conversations/${item.id}`,{params:{size:100}});
                this.messages=(response.data.data||[]).slice().reverse();
                await axios.put(`/api/messages/conversations/${item.id}/read`);
                item.unreadCount=0;
                window.dispatchEvent(new CustomEvent('message-unread-changed'));
                this.scrollBottom();
            }catch(error){ this.errorMessage=error.response?.data?.message||'聊天记录加载失败'; }
            finally{ this.loadingMessages=false; }
        },
        async sendMessage(){
            const content=this.draft.trim(); if(!content||!this.activePeerId||this.sending)return;
            this.sending=true; this.errorMessage='';
            const clientMessageId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
            try{
                const response=await axios.post(`/api/messages/users/${this.activePeerId}`,{clientMessageId,type:'TEXT',content});
                const saved=response.data.data; this.draft='';
                if(this.activeConversation){ this.messages.push(saved); }
                await this.loadConversations();
                const item=this.conversations.find(x=>String(x.peerId)===String(this.activePeerId));
                if(item){
                    if(!this.activeConversation) await this.openConversation(item);
                    else { this.activeConversation=item; this.scrollBottom(); }
                }
            }catch(error){ this.errorMessage=error.response?.data?.message||'发送失败，请稍后重试'; }
            finally{ this.sending=false; }
        },
        async refreshActive(){
            if(document.hidden)return;
            await this.loadConversations();
            if(this.activeConversation){
                const oldLast=this.messages.length?this.messages[this.messages.length-1].id:0;
                if((this.activeConversation.lastMessageId||0)>oldLast) await this.openConversation(this.activeConversation);
            }
        },
        scrollBottom(){ this.$nextTick(()=>{ const el=this.$refs.messages; if(el)el.scrollTop=el.scrollHeight; }); },
        viewPeer(){ location.href=`profile.html?userId=${encodeURIComponent(this.activePeerId)}`; },
        formatTime(value){ return value?String(value).replace('T',' ').slice(0,16):''; },
        shortTime(value){ return value?String(value).replace('T',' ').slice(5,16):''; }
    }
});
</script>
</body>
</html>
